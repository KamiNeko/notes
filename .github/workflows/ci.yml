name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before publishing
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    # The SDK image, so the job needs no setup action; Postgres runs as a service next to it
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTES_TEST_DATABASE: "Host=postgres;Port=5432;Username=notes;Password=notes"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dotnet restore Notes.slnx --locked-mode
      # Warnings are errors (TreatWarningsAsErrors in the project files)
      - run: dotnet build Notes.slnx --no-restore
      - run: dotnet test --solution Notes.slnx --no-build

  client:
    name: Client and UI package (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm workspaces: installs the client and packages/ui from the root lockfile
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm --prefix packages/ui run lint
      - run: npm --prefix packages/ui run typecheck
      - run: npm --prefix packages/ui test
      - run: npm --prefix client run lint
      - run: npm --prefix client test
      - run: npm --prefix client run build

  e2e:
    name: End-to-end smoke tests (Playwright + demo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE: "Host=localhost;Port=5432;Database=notes_e2e;Username=notes;Password=notes"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: dotnet build backend/src/Notes.Api
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Uses the Google Chrome preinstalled on the runner (channel "chrome"), no browser download
      - run: npm run test:e2e
        working-directory: client

  dependencies:
    name: Dependency audit (known vulnerabilities)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: NuGet packages (direct and transitive)
        working-directory: backend
        run: |
          dotnet restore Notes.slnx --locked-mode
          dotnet list Notes.slnx package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm packages (production and build, all workspaces)
        run: npm audit --audit-level=moderate

  dependency-review:
    name: Dependency review (new dependencies and licenses)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Licenses that are compatible with publishing Notes under MIT
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, CC-BY-4.0, Unlicense, BlueOak-1.0.0, Python-2.0, MPL-2.0, PostgreSQL
          # Transitive dependencies of mermaid (diagram rendering), shipped unmodified in the bundle:
          # elkjs is EPL-2.0 (weak copyleft, file-level), robust-predicates is Unlicense plus a public
          # domain notice the action can't classify
          allow-dependencies-licenses: pkg:npm/elkjs, pkg:npm/robust-predicates

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: notes:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Known vulnerabilities in the OS packages and libraries of the runtime image
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: notes:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Smoke test with docker compose
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-database-password
          NOTES_ADMIN_EMAIL=admin@example.com
          NOTES_ADMIN_PASSWORD=ci-admin-password
          ENV
          # Use the image built above instead of building again
          cat > docker-compose.override.yml <<'YML'
          services:
            notes:
              image: notes:ci
              pull_policy: never
          YML
          docker compose up -d --no-build --wait --wait-timeout 120 || { docker compose logs; exit 1; }
          health=$(curl -fsS http://localhost:8080/api/health)
          echo "$health"
          echo "$health" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .version == "dev" and .commit == $sha'
          # The bundled client is served too
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # The first administrator was created and can sign in
          curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password"}' | jq -e '.user.isAdmin'
          docker compose exec -T notes dotnet Notes.Api.dll users list | grep -q admin@example.com
          # The hardening from docker-compose.yml is in effect
          [ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' notes)" = true ]
          [ "$(docker compose exec -T notes id -u)" != 0 ]
          docker compose down -v
