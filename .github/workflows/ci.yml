name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    # The SDK image, so the job needs no setup action; Postgres runs as a service next to it
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTES_TEST_DATABASE: "Host=postgres;Port=5432;Username=notes;Password=notes"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dotnet restore Notes.slnx
      # Warnings are errors (TreatWarningsAsErrors in the project files)
      - run: dotnet build Notes.slnx --no-restore
      - run: dotnet test --solution Notes.slnx --no-build

  client:
    name: Client (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end smoke tests (Playwright + demo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE: "Host=localhost;Port=5432;Database=notes_e2e;Username=notes;Password=notes"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet build backend/src/Notes.Api
      - run: npm ci
        working-directory: client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Uses the Google Chrome preinstalled on the runner (channel "chrome"), no browser download
      - run: npm run test:e2e
        working-directory: client

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: notes:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with docker compose
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-database-password
          NOTES_ADMIN_EMAIL=admin@example.com
          NOTES_ADMIN_PASSWORD=ci-admin-password
          ENV
          # Use the image built above instead of building again
          cat > docker-compose.override.yml <<'YML'
          services:
            notes:
              image: notes:ci
              pull_policy: never
          YML
          docker compose up -d --no-build --wait --wait-timeout 120 || { docker compose logs; exit 1; }
          health=$(curl -fsS http://localhost:8080/api/health)
          echo "$health"
          echo "$health" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .version == "dev" and .commit == $sha'
          # The bundled client is served too
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # The first administrator was created and can sign in
          curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password"}' | jq -e '.user.isAdmin'
          docker compose exec -T notes dotnet Notes.Api.dll users list | grep -q admin@example.com
          docker compose down -v
